name: 🧪 E2E Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  E2E:
    name: Playwright E2E Tests
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      VITE_ENV_NAME: tests
      DATABASE_URL: postgres://cowat:cowat@localhost:5432/cowat
      AUTH_SECRET: fyXjLxjXJowjicI2BAjxOaUsQd1QafdegZDciJE/xM8=
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: Cowat <noreply@example.com>
      S3_HOST: localhost:9000
      S3_BUCKET_NAME: default
      S3_ACCESS_KEY_ID: cowat-access-key
      S3_SECRET_ACCESS_KEY: cowat-secret-key
      S3_SECURE: false
      S3_FORCE_PATH_STYLE: true
      DOCKER_MINIO_USERNAME: minioadmin
      DOCKER_MINIO_PASSWORD: minioadmin
      VITE_S3_BUCKET_PUBLIC_URL: http://localhost:9000/default
      FIREBASE_API_KEY: test-api-key
      FIREBASE_AUTH_DOMAIN: cowat-tests.firebaseapp.com
      FIREBASE_PROJECT_ID: cowat-tests
      FIREBASE_STORAGE_BUCKET: cowat-tests.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      FIREBASE_APP_ID: 1:1234567890:web:test
      FIREBASE_VAPID_PUBLIC_KEY: test-vapid-public-key
      FIREBASE_SERVICE_ACCOUNT: 
      CRON_SECRET: test-cron-secret
    services:
      postgres:
        image: postgres:16.1

        env:
          POSTGRES_PASSWORD: cowat
          POSTGRES_USER: cowat
          POSTGRES_DB: cowat

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-${{ env.cache-name }}-
            ${{ runner.os }}-pnpm-store-
            ${{ runner.os }}-

      - name: Install deps
        run: pnpm install

      - name: Start MailDev SMTP server
        run: |
          pnpm exec maildev \
            --smtp 1025 \
            --silent &

          until nc -z localhost 1025 && curl -sf http://127.0.0.1:1080/healthz > /dev/null; do
            echo "Waiting for MailDev..."
            sleep 2
          done
          echo "MailDev is ready"

      - name: Start MinIO server
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1 \
            server /data --console-address :9001

          # Wait for MinIO to be ready
          until curl -sf http://localhost:9000/minio/health/live; do
            echo "Waiting for MinIO..."
            sleep 2
          done
          echo "MinIO is ready"

      - name: Setup MinIO bucket
        run: |
          # Install MinIO client
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

          # Configure MinIO client
          mc alias set minio http://localhost:9000 minioadmin minioadmin

          # Create user with access key
          mc admin user add minio $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY
          mc admin policy attach minio readwrite --user $S3_ACCESS_KEY_ID

          # Create bucket and set permissions
          mc mb --ignore-existing minio/$S3_BUCKET_NAME
          mc anonymous set download minio/$S3_BUCKET_NAME

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Migrate database
        run: pnpm db:push

      - name: Add default data into database
        run: pnpm db:seed

      - name: Run Playwright tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
